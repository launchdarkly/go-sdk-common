version: "2"

run:
  timeout: 120s
  tests: false

linters:
  enable:
    - bodyclose
    - dupl
    - errcheck
    - goconst
    - gochecknoglobals
    - gochecknoinits
    - gocritic
    - gocyclo
    - godox
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - nolintlint
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  exclusions:
    rules:
      - path: ldvalue/optional_.*.go
        linters:
          - dupl  # This linter would produce false positives due to necessary boilerplate code in ldvalue/optional_*.go

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: false
    goimports:
      local-prefixes:
        - github.com/launchdarkly

issues:
  max-same-issues: 1000
