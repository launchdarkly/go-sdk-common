name: Check Released Dependencies

# Fails when a published module's go.mod pins a LaunchDarkly module to
# anything other than a final released version (a pseudo-version, a
# pre-release tag such as v3.6.0-rc1, or a `replace`), so that unreleased
# components cannot be merged onto a release branch.
#
# This only runs for release branches. Feature branches (feat/**) routinely
# pin unreleased components during development, so a feature-to-feature merge
# is never gated; once a feature branch is ready, merging it to a release
# branch is gated here.
#
# A pull_request workflow is read from the PR's merge commit, so this file
# must exist on every branch it gates. Keep it identical on v3 and v4, and
# extend the branch lists below as new release branches open.
#
# The check is the shared check-released-go-deps action from
# launchdarkly/gh-actions, which go-server-sdk and ld-relay also use; its
# README lists the rules. It parses go.mod files directly, so no Go toolchain
# is needed.

on:
  push:
    branches: ['v3', 'v4']
  pull_request:
    branches: ['v3', 'v4']

permissions:
  contents: read

jobs:
  check-released-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify go.mod references released LaunchDarkly module versions
        uses: launchdarkly/gh-actions/actions/check-released-go-deps@check-released-go-deps-v0
